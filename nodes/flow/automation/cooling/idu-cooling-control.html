<script type="text/javascript">
    RED.nodes.registerType("uniflex-idu-cooling-control", {
        category: "uniflex cooling",
        color: "#A8D8EA",
        icon: "font-awesome/fa-snowflake-o",
        defaults: {
            name: { value: "" },
            coolingConfig: { value: "", type: "uniflex-cooling-config" },
            tempTopic: { value: "" },
            setpointTopic: { value: "" },
            iduSetpointTopic: { value: "" },
            windowTopic: { value: "" },
            ecoTopic: { value: "" },
            coolCmdTopic: { value: "" },
            coolValveTopic: { value: "" },
            demandMode: { value: "threshold" },
            hysteresisC: { value: 0.3, validate: RED.validators.number() },
            windowOpenValue: { value: 1, validate: RED.validators.number() },
            enableDebug: { value: false }
        },
        inputs: 1,
        outputs: 1,
        label: function () { return this.name || "idu cooling"; },
        paletteLabel: "idu cooling",

        oneditprepare: function () {
            let _controllers = {};

            function initAutocomplete(el) {
                el.autocomplete({
                    minLength: 0,
                    source: function (req, res) {
                        const term = (req.term || "").toLowerCase();
                        const topics = (_controllers?.controllers || []).flatMap(c => c.formattedTopics || []);
                        res(topics.filter(item => {
                            const label = String(item.label || item.topic || "").toLowerCase();
                            const topic = String(item.topic || item.value || "").toLowerCase();
                            return label.indexOf(term) >= 0 || topic.indexOf(term) >= 0;
                        }));
                    },
                    focus: function (e) { e.preventDefault(); },
                    select: function (e, ui) {
                        e.preventDefault();
                        el.val(ui.item.topic || ui.item.value || ui.item.label || "");
                    }
                }).on("focus", function () {
                    el.autocomplete("search", el.val() || "");
                });
            }

            $.getJSON("uniflex/controller-config", function (data) {
                _controllers = data || {};
                [
                    "tempTopic",
                    "setpointTopic",
                    "iduSetpointTopic",
                    "windowTopic",
                    "ecoTopic",
                    "coolCmdTopic",
                    "coolValveTopic"
                ].forEach(function (id) {
                    initAutocomplete($("#node-input-" + id));
                });
            }).fail(function () {
                _controllers = {};
            });

            function updateThresholdVisibility() {
                const configId = $("#node-input-coolingConfig").val();
                if (configId && configId !== "_ADD_") {
                    $("#idc-local-thresholds").hide();
                    $("#idc-using-shared").show();
                } else {
                    $("#idc-local-thresholds").show();
                    $("#idc-using-shared").hide();
                }
            }
            $("#node-input-coolingConfig").on("change", updateThresholdVisibility);
            setTimeout(updateThresholdVisibility, 100);
        }
    });
</script>

<script type="text/html" data-help-name="uniflex-idu-cooling-control">
    <h3>IDU cooling control</h3>
    <p>Enables room IDU cooling when temperature approaches the cooling setpoint. The IDU handles fine control around the setpoint; this node only sends on/off to CAC/CBC.</p>

    <h4>Datastreams (perton)</h4>
    <ul>
        <li><b>THT/TGT&lt;flat&gt;W</b> thermokon effective SP: .4 living, .6 bed (enable input)</li>
        <li><b>CTA/CTB set1</b> written by this node (therm SP + GDBW.1 + GDBW.2) to iduSetpointTopic</li>
        <li><b>CAC&lt;flat&gt;S.1</b> single-IDU cool command</li>
        <li><b>CBC&lt;flat&gt;W.1</b> / <b>.2</b> dual-IDU living / bed cool command</li>
        <li><b>AxxxS</b> / <b>BxxxW</b> window sensors (1 = open)</li>
        <li><b>E1C/E2C/E2N&lt;flat&gt;W</b> E display: .2 living, .3 bed (ECO-active value set in cooling config, default 1)</li>
        <li><b>CGOLS.1</b> global disable (1=no cooling, 0=allow), set via mypanel, persisted in dichannels</li>
    </ul>

    <h4>Shared config</h4>
    <p>Link a <code>cooling config</code> node for shared hysteresis and CGOLS global disable.
        Deadband (<code>GDBW.1</code>) and IDU offset (<code>GDBW.2</code>) arrive on the io-read fan-out (read-data-streams conv_coef 10 -> C).</p>

    <h4>Logic</h4>
    <ul>
        <li>Cool ON when temp &gt; therm SP + half GDBW.1 + hysteresis; OFF below therm SP + half GDBW.1 - hysteresis</li>
        <li>IDU setpoint (CTA/CTB set1) = therm SP + GDBW.1 + GDBW.2; written only while cool is on (therm SP / GDBW change and every 60 s)</li>
        <li>If cool is off but CAS/CBS mode-cool stays 1 for 3 min, force-write CAD/CBD 159 (GW3-MOD off). Same-value CAC=0 does not reach Modbus.</li>
        <li>Cool OFF when CGOLS disable active, window open, or E display ECO active</li>
        <li>Stalled/unknown input (JSON null): store unknown, do not keep last. Temp/SP/valve unknown = cool off and no set1; window/eco/CGOLS unknown = inhibit</li>
        <li>All temperatures in degrees C (dC conversion in read/write nodes)</li>
    </ul>

    <h4>Example flow</h4>
    <pre>
[read-data-streams] --&gt; [idu-cooling-control] --&gt; [write-data-streams]
    CTA206W.1, THT206W.4, A206S.1, THE206W.2     CAC206S.1 + CTA206W.3
    </pre>
</script>
