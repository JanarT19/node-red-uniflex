<script type="text/javascript">
    RED.nodes.registerType("uniflex-thermokon-global-sp", {
        category: "uniflex",
        color: "#E8D8B0",
        defaults: {
            name: { value: "" },
            enableDebug: { value: false },
            host: { value: "127.0.0.1" },
            tcpPort: { value: 19080, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 0,

        paletteLabel: "thermokon global sp"
    });
</script>

<script type="text/html" data-template-name="uniflex-thermokon-global-sp">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="TGSW fan-out" />

    <div class="form-row">
        <label for="node-input-host">TCP host</label>
        <input type="text" id="node-input-host" placeholder="127.0.0.1" />
    </div>

        <label for="node-input-tcpPort">TCP port</label>

    </div>

        <label for="node-input-enableDebug">Debug log</label>
        <input type="checkbox" id="node-input-enableDebug" style="width:auto;" />

    <p style="font-size:0.85em;color:#666;margin:8px 0;">
        On TGSW save, any changed member triggers debounced fan-out of all three

</script>

<script type="text/html" data-help-name="uniflex-thermokon-global-sp">
    <h3>thermokon global setpoints</h3>
    <p>On <code>TempKehtesta</code> save, any changed TGSW member fans out <b>all three</b> slots (eco, lo, hi) using cached TGSW values.</p>
    <p>Compares cached S reads for logging only; always forced-writes all zones on save (cache can lie after old ai setup).</p>
</script>
