<script type="text/javascript">
    RED.nodes.registerType("uniflex-price-handler", {
        category: "uniflex heating",
        paletteLabel: "price handler",
        color: "#c7e9ff",
        defaults: {
            name: { value: "" },
            elecSpotTitle: { value: "electricity.spot" },
            gasSpotTitle: { value: "gas.spot" },
            elecTransportTitle: { value: "electricity.transport_tax" },
            gasTransportTitle: { value: "gas.transport_tax" },
            elecHeatTitle: { value: "heat_price.electricity" },
            gasHeatTitle: { value: "heat_price.gas" },
            elecTransportDay: { value: 0 },
            elecTransportNight: { value: 0 },
            elecMonthlyCost1: { value: 0 },
            elecMonthlyCost1Comment: { value: "" },
            elecMonthlyCost2: { value: 0 },
            elecMonthlyCost2Comment: { value: "" },
            elecTax1: { value: 0 },
            elecTax1Comment: { value: "" },
            elecTax2: { value: 0 },
            elecTax2Comment: { value: "" },
            elecVat: { value: 0 },
            dayStartHour: { value: 7 },
            dayEndHour: { value: 23 },
            useSummertime: { value: false },
            holidaysTitle: { value: "holiday" },
            weekdaysActive: { value: [1, 2, 3, 4, 5] },
            gasMonthlyCost1: { value: 0 },
            gasMonthlyCost1Comment: { value: "" },
            gasMonthlyCost2: { value: 0 },
            gasMonthlyCost2Comment: { value: "" },
            gasTransportPerM3: { value: 0 },
            gasTransportPerM3Comment: { value: "" },
            gasTax1PerM3: { value: 0 },
            gasTax1PerM3Comment: { value: "" },
            gasTax2PerM3: { value: 0 },
            gasTax2PerM3Comment: { value: "" },
            gasHeatingValuePerM3: { value: 10.0 },
            gasVat: { value: 0 },
            copT1: { value: -5 },
            copV1: { value: 2.5 },
            copT2: { value: 7 },
            copV2: { value: 3.5 },
            ambientTempTitle: { value: "main.temp" },
            boilerEff: { value: 0.9 },
            calendarTopic: { value: "calendar/price-handler" },
            enableLogging: { value: true },
            debugTopics: { value: "" },
            retryCount: { value: 3 },
            retryDelayMinutes: { value: 30 },
            intervalMinutes: { value: 15 }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-line-chart",
        label: function () {
            return this.name || "price-handler";
        },
        oneditprepare: function () {
            const weekdays = this.weekdaysActive || [1, 2, 3, 4, 5];
            $(".price-handler-weekday").each(function () {
                const val = parseInt($(this).val(), 10);
                $(this).prop("checked", weekdays.indexOf(val) !== -1);
            });
        },
        oneditsave: function () {
            const selected = [];
            $(".price-handler-weekday:checked").each(function () {
                selected.push(parseInt($(this).val(), 10));
            });
            this.weekdaysActive = selected;
        }
    });
</script>

<script type="text/html" data-help-name="uniflex-price-handler">
    <p><b>Price Handler</b> - Calculates electricity and gas heat prices for MPC optimization.</p>

    <h3>Purpose</h3>
    <p>Reads electricity spot prices from calendar, applies transport costs, taxes, and heat pump/boiler efficiencies to calculate the effective cost of heat from each source. These prices are used by <code>mpc-house</code> to schedule the cheapest heating option.</p>

    <h3>Outputs (Written to Calendar)</h3>
    <ul>
        <li><b>electricity.transport</b> - Spot price + transport + taxes (cents/kWh)</li>
        <li><b>heat_price.electricity</b> - Electricity heat price = transport price / COP (cents/kWh_heat)</li>
        <li><b>heat_price.gas</b> - Gas heat price = gas price / boiler efficiency (cents/kWh_heat)</li>
    </ul>

    <h3>COP Calculation</h3>
    <p>The heat pump COP (Coefficient of Performance) varies with outdoor temperature. Configure two reference points:</p>
    <ul>
        <li><b>COP @T1</b> - COP at temperature T1 (e.g., 3.0 @ -10°C)</li>
        <li><b>COP @T2</b> - COP at temperature T2 (e.g., 5.0 @ +10°C)</li>
    </ul>
    <p>COP is linearly interpolated for temperatures between T1 and T2, clamped outside this range.</p>

    <h3>Price Components</h3>
    <ul>
        <li><b>Transport price</b> - Grid transport fee (cents/kWh)</li>
        <li><b>Taxes</b> - Electricity tax, renewable levy, etc. (cents/kWh)</li>
        <li><b>Gas price</b> - Fixed gas price including transport (cents/kWh)</li>
        <li><b>Boiler efficiency</b> - Gas boiler efficiency (~0.95-1.0 for condensing)</li>
    </ul>

    <h3>Usage</h3>
    <ol>
        <li>Configure transport costs and efficiencies in the node settings</li>
        <li>Wire output to <code>sql-calendar</code> node(s)</li>
        <li>Trigger after electricity spot prices are fetched (e.g., daily at 14:00)</li>
        <li>Heat prices will be available in calendar for MPC scheduling</li>
    </ol>

    <h3>Retry Logic</h3>
    <p>If required data (spot prices or temperature forecast) is missing, the node will retry after the configured delay. Useful when price-fetcher runs slightly before price-handler.</p>

    <h3>Time Window</h3>
    <p>Derived from available spot data (midnight today to last available spot timestamp, typically 01:00 day+2). Spot interval is configurable (was 60min until 2024, now typically 15min).</p>
</script>
