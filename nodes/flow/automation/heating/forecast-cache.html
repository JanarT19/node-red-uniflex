<script type="text/html" data-help-name="uniflex-forecast-cache">
    <h3>Forecast Cache</h3>
    <p>
        Fetches full forecast arrays (outdoor temperature, wind speed, solar irradiance) from
        sql-calendar and stores them in <code>flow.forecastCache</code> for consumption by
        <code>mpc-room-advanced</code> nodes during demand forecasting.
        Also writes calendar series <code>main_temp_avg</code>: one outdoor-temperature mean
        per local date, from today through the forecast. Past dates are not kept.
    </p>

    <h4>When to trigger</h4>
    <p>
        Wire from the weather fetch chain output (after openweather-fetcher writes to calendar).
        Typically fires twice daily after weather forecast refresh.
        Any input message triggers a fetch -- topic is ignored.
    </p>

    <h4>Flow Context</h4>
    <p>Stores <code>flow.forecastCache</code> with keys:</p>
    <ul>
        <li><code>timestamp</code> -- when cache was written (ms)</li>
        <li><code>baseSlot</code> -- start timestamp of slot 0 (unix seconds)</li>
        <li><code>stepSec</code> -- slot width in seconds</li>
        <li><code>slots</code> -- max array length (arrays may differ in length)</li>
        <li><code>Tout</code> -- outdoor temperature array (°C)</li>
        <li><code>wind</code> -- wind speed array (m/s)</li>
        <li><code>irradiance</code> -- solar irradiance array (kW/m²)</li>
    </ul>
    <p>Array lengths are auto-determined from available calendar data. Consumers
    should check array bounds and use <code>slots</code> or individual array lengths.</p>

    <h4>Typical Wiring</h4>
    <pre>
[cronplus 04:30,16:30] → [openweather-fetcher] → [sql-calendar] → [forecast-cache]
    </pre>
</script>
