<script type="text/javascript">
    RED.nodes.registerType("uniflex-forecast-publisher", {
        category: "uniflex home",
        color: "#CFE8FF",
        icon: "font-awesome/fa-cloud",
        defaults: {
            name: { value: "" },

            // Calendar API
            calendarHost: { value: "localhost" },
            calendarPort: { value: 80, validate: RED.validators.number() },

            // Calendar series titles
            toutTitle: { value: "main.temp" },
            windTitle: { value: "wind.speed" },
            cloudsTitle: { value: "clouds.all" },
            solarGainTitle: { value: "solar_irradiance" },

            // Output topic prefixes (iolayer: FCTW.1, FCWW.1, FCCW.1, etc.)
            toutTopicPrefix: { value: "FCTW" },
            windTopicPrefix: { value: "FCWW" },
            cloudsTopicPrefix: { value: "FCCW" },
            solarTopicPrefix: { value: "FSRW" },

            // Tick topic
            tickTopic: { value: "heating/tick" },


            // Fetch on startup
            fetchOnStartup: { value: true }
        },
        inputs: 1,
        outputs: 1,
        label: function () {
            return this.name || "forecast publisher";
        },
        paletteLabel: "forecast publisher",

        oneditprepare: function () {
            // Known iolayer forecast datastreams (write topics)
            const forecastDatastreams = [
                { label: "FCTW - ForecaTemp (temperature)", value: "FCTW" },
                { label: "FCWW - ForecaWind (wind speed)", value: "FCWW" },
                { label: "FCCW - ForecaClouds (cloudiness)", value: "FCCW" },
                { label: "FSRW - Solar irradiance forecast (kW/m²)", value: "FSRW" }
            ];

            function initForecastAutocomplete(element) {
                element.autocomplete({
                    minLength: 0,
                    source: function (request, response) {
                        const term = request.term.toLowerCase();
                        const matches = forecastDatastreams.filter(function (item) {
                            return item.label.toLowerCase().indexOf(term) >= 0 ||
                                item.value.toLowerCase().indexOf(term) >= 0;
                        });
                        response(matches);
                    },
                    select: function (event, ui) {
                        element.val(ui.item.value);
                        return false;
                    }
                }).on("focus", function () {
                    element.autocomplete("search", "");
                });
            }

            initForecastAutocomplete($("#node-input-toutTopicPrefix"));
            initForecastAutocomplete($("#node-input-windTopicPrefix"));
            initForecastAutocomplete($("#node-input-cloudsTopicPrefix"));
            initForecastAutocomplete($("#node-input-solarTopicPrefix"));
        }
    });
</script>

<script type="text/html" data-help-name="uniflex-forecast-publisher">
    <h3>Forecast Publisher</h3>
    <p>
        Queries weather forecast from sql-calendar on heating tick and publishes lookahead values
        to iolayer topics. Replaces Python-based ForecaTemp/ForecaWind/ForecaClouds publisher.
    </p>

    <h4>Purpose</h4>
    <p>
        Instead of having 18 floor loops each query the calendar API for weather data, this single node
        fetches once per heating tick and publishes to iolayer. All interested nodes (floor loops, MPC, etc.)
        receive the data via their existing iolayer subscription.
    </p>

    <h4>Input</h4>
    <ul>
        <li><b>Tick message</b> – topic matching tickTopic (e.g., "heating/tick") triggers a fetch</li>
        <li><b>Manual trigger</b> – empty topic or "trigger"/"fetch" topic also triggers fetch</li>
    </ul>

    <h4>Output</h4>
    <p>Publishes 16 messages (4 horizons × 4 series):</p>
    <ul>
        <li><code>FCTW.1</code> (3h), <code>.2</code> (6h), <code>.3</code> (12h), <code>.4</code> (24h) – temperature °C</li>
        <li><code>FCWW.1</code>, <code>.2</code>, <code>.3</code>, <code>.4</code> – wind speed m/s</li>
        <li><code>FCCW.1</code>, <code>.2</code>, <code>.3</code>, <code>.4</code> – cloudiness %</li>
        <li><code>FSRW.1</code>, <code>.2</code>, <code>.3</code>, <code>.4</code> – solar irradiance kW/m²</li>
    </ul>
    <p>Wire output to iolayer write node to distribute to all subscribers.</p>

    <h4>Timing</h4>
    <p>
        Values are refreshed on every tick input. Wire to a clock-ticker or inject node for periodic updates.
    </p>

    <h4>Typical Wiring</h4>
    <pre>
[clock-ticker] → [forecast-publisher] → [write-data-streams]
       ↑
  heating/tick (every 1200s)
    </pre>

    <h4>Status</h4>
    <ul>
        <li>Grey: Waiting for first tick</li>
        <li>Green: Last fetch successful, shows T6h and W6h values</li>
        <li>Red: Fetch error</li>
    </ul>
</script>
