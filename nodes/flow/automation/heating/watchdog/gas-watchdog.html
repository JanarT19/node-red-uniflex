<script type="text/javascript">
    RED.nodes.registerType("uniflex-gas-watchdog", {
        category: "uniflex home",
        color: "#FDE68A",
        icon: "font-awesome/fa-heartbeat",
        defaults: {
            name: { value: "" },
            enableCmdTopic: { value: "gas_enable" },
            needHeatTopic: { value: "HQV.1" },
            flameTopic: { value: "IMODW.4" },
            pumpHeatingTopic: { value: "IMODW.2" },
            dhwActiveTopic: { value: "IMODW.3" },
            blockTopic: { value: "" },
            outAvailTopic: { value: "HAVW.1" },
            needThresholdKw: { value: 0.1, validate: RED.validators.number() },
            noEvidenceTimeoutSec: { value: 600, validate: RED.validators.number() },
            recoveryClearSec: { value: 180, validate: RED.validators.number() },
            ignoreWhileDhw: { value: true }
        },
        inputs: 1,
        outputs: 1,
        label: function () { return this.name || "gas-watchdog"; },
        paletteLabel: "gas watchdog",
        oneditprepare: function () {
            let _controllers = {};
            function getTopics() {
                const out = [];
                const seen = new Set();
                const controllers = _controllers && Array.isArray(_controllers.controllers) ? _controllers.controllers : [];
                for (let i = 0; i < controllers.length; i++) {
                    const c = controllers[i] || {};
                    const fromFormatted = Array.isArray(c.formattedTopics) ? c.formattedTopics : [];
                    for (let j = 0; j < fromFormatted.length; j++) {
                        const item = fromFormatted[j] || {};
                        const topic = String(item.topic || item.value || "").trim();
                        if (!topic || seen.has(topic)) continue;
                        seen.add(topic);
                        out.push({
                            label: item.label || topic,
                            topic: topic
                        });
                    }
                    const services = c.services || {};
                    Object.keys(services).forEach(function (k) {
                        if (!k || seen.has(k)) return;
                        seen.add(k);
                        out.push({ label: k, topic: k });
                    });
                }
                return out;
            }
            function initAutocomplete(element) {
                element.autocomplete({
                    minLength: 0,
                    source: function (request, response) {
                        const term = (request.term || "").toLowerCase();
                        const matches = getTopics().filter(function (item) {
                            const label = String(item.label || item.topic || "").toLowerCase();
                            const topic = String(item.topic || item.value || "").toLowerCase();
                            return label.indexOf(term) >= 0 || topic.indexOf(term) >= 0;
                        });
                        response(matches);
                    },
                    focus: function () { return false; },
                    select: function (event, ui) {
                        this.value = ui.item.topic || ui.item.value || ui.item.label || "";
                        return false;
                    }
                }).on("focus", function () {
                    element.autocomplete("search", "");
                });
            }
            $.getJSON("uniflex/controller-config", function (data) {
                _controllers = data || {};
                [
                    "#node-input-enableCmdTopic",
                    "#node-input-needHeatTopic",
                    "#node-input-flameTopic",
                    "#node-input-pumpHeatingTopic",
                    "#node-input-dhwActiveTopic",
                    "#node-input-blockTopic",
                    "#node-input-outAvailTopic"
                ].forEach((sel) => initAutocomplete($(sel)));
            }).fail(function () { _controllers = {}; });
        }
    });
</script>

<script type="text/html" data-template-name="uniflex-gas-watchdog">
    <div class="form-row"><label>Name</label><input type="text" id="node-input-name" /></div>
    <h4>Input topics</h4>
    <div class="form-row"><label>Enable cmd</label><input type="text" id="node-input-enableCmdTopic" /></div>
    <div class="form-row"><label>Need heat (kW)</label><input type="text" id="node-input-needHeatTopic" /></div>
    <div class="form-row"><label>Flame</label><input type="text" id="node-input-flameTopic" /></div>
    <div class="form-row"><label>Pump heating</label><input type="text" id="node-input-pumpHeatingTopic" /></div>
    <div class="form-row"><label>DHW active</label><input type="text" id="node-input-dhwActiveTopic" /></div>
    <div class="form-row"><label>Block (opt)</label><input type="text" id="node-input-blockTopic" /></div>
    <h4>Output topic</h4>
    <div class="form-row"><label>Available out</label><input type="text" id="node-input-outAvailTopic" /></div>
    <h4>Params</h4>
    <div class="form-row"><label>Need threshold (kW)</label><input type="number" step="0.01" id="node-input-needThresholdKw" /></div>
    <div class="form-row"><label>No-evidence timeout (s)</label><input type="number" step="1" id="node-input-noEvidenceTimeoutSec" /></div>
    <div class="form-row"><label>Recovery clear (s)</label><input type="number" step="1" id="node-input-recoveryClearSec" /></div>
    <div class="form-row"><label>Ignore during DHW</label><input type="checkbox" id="node-input-ignoreWhileDhw" style="width:auto;" /></div>
    <p class="form-tips">Output is problem flag: 0=OK, 1=gas source unavailable due to missing heat evidence while enabled and heat is needed.</p>
</script>

<script type="text/html" data-help-name="uniflex-gas-watchdog">
    <p>Gas-boiler availability watchdog. While gas is enabled and heat is needed, expects flame or heating-pump evidence; otherwise raises a problem flag for tank-control.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>Enable cmd <span class="property-type">0/1</span></dt>
        <dd>Gas enable command topic.</dd>
        <dt>Need heat <span class="property-type">number kW</span></dt>
        <dd>Heat demand; need when &gt; need threshold.</dd>
        <dt>Flame / pump heating <span class="property-type">0/1</span></dt>
        <dd>Running evidence: either flame or heating pump active.</dd>
        <dt>DHW active <span class="property-type">0/1</span></dt>
        <dd>Optional. When <b>Ignore during DHW</b> is on and DHW is active, monitoring holds (problem cleared).</dd>
        <dt>Block <span class="property-type">0/1</span></dt>
        <dd>Optional. Blocks monitoring while set.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>Available / problem out <span class="property-type">0/1</span></dt>
        <dd><code>0</code> = OK, <code>1</code> = unavailable. Wire to tank-control source-problem (gas member).</dd>
    </dl>

    <h3>Details</h3>
    <p>Same timeout / recovery pattern as hp-watchdog: problem asserts after no-evidence timeout while monitoring is active; clears after recovery-clear seconds of evidence. Output changes only when the problem flag changes.</p>
</script>
