<script type="text/javascript">
    RED.nodes.registerType("uniflex-room-loop", {
        category: "uniflex home",
        color: "#FFD9B3",
        icon: "font-awesome/fa-home",
        defaults: {
            name: { value: "" },

            globalTickTopic: { value: "heating/tick", required: true },
            roomTickTopic: { value: "", required: true },

            tickDelaySec: {
                value: 0,
                validate: function (v) {
                    return v !== "" && !isNaN(v) && Number(v) >= 0;
                }
            },

            tRoomTopic: { value: "", required: true },
            spRoomTopic: { value: "", required: true },
            tRetOut: { value: "", required: true },

            errorTopic: { value: "" },

            // Embedded PID parameters
            Kp: {
                value: 1.0,
                validate: function (v) {
                    return v !== "" && !isNaN(v) && Number(v) >= 0 && Number(v) <= 1;
                }
            },
            Ii: {
                value: 0.0,
                validate: function (v) {
                    return v !== "" && !isNaN(v) && Number(v) >= 0 && Number(v) <= 1;
                }
            },
            Dd: {
                value: 0.0,
                validate: function (v) {
                    return v !== "" && !isNaN(v) && Number(v) >= 0 && Number(v) <= 1;
                }
            },

            outClampLow: { value: 10, validate: RED.validators.number() },
            outClampHigh: { value: 40, validate: RED.validators.number() },

            persistencePath: { value: "/home/nodered/heating_state" }
        },
        inputs: 1,
        outputs: 1,
        label: function () {
            return this.name || "room loop";
        },
        paletteLabel: "room loop",

        oneditprepare: function () {
            const node = this;
            let _controllers = {};

            function updateTipText() {
                const delay = $("#node-input-tickDelaySec").val() || "<not set>";
                const tickTopic = $("#node-input-roomTickTopic").val() || `<not set>`;
                const tretOut = $("#node-input-tRetOut").val() || `<not set>`;
                const persistencePath = $("#node-input-persistencePath").val();
                const name = $("#node-input-name").val();

                const tipText1 = `On global tick, this node will publish a room sync tick '${tickTopic}' after ${delay}s delay.`;
                const tipText2 = `Floor setpoint will be calculated using embedded PID controller and published to floor loops via '${tretOut}'`;
                const tipText3 = persistencePath
                    ? `PID parameters will be saved to '${persistencePath}/room-loop-${name}.json' for persistence across restarts.`
                    : "PID parameters will not be persisted across restarts (persistence path not set).";

                $("#node-input-tip-text-1").text(tipText1);
                $("#node-input-tip-text-2").text(tipText2);
                $("#node-input-tip-text-3").text(tipText3);
            }

            // Define event listeners for form fields
            $("#node-input-tickDelaySec, #node-input-roomTickTopic, #node-input-tRetOut, #node-input-persistencePath").on("input change", updateTipText);

            // Initialize topic dropdown and tip text
            queryControllerConfig();
            updateTipText();

            // Query topics defined in read and write nodes
            function queryControllerConfig() {
                $.getJSON(`uniflex/controller-config`, function (data) {
                    _controllers = data;

                    initializeAutocomplete($("#node-input-tRoomTopic"));
                    initializeAutocomplete($("#node-input-spRoomTopic"));

                    initializeAutocomplete($("#node-input-tRetOut"));
                }).fail(function () {
                    console.error("Failed to get topics!");
                    _controllers = {};
                });
            }

            // Initialize autocomplete for topic inputs in the editable list
            function initializeAutocomplete(element, onSelect = null) {
                element
                    .autocomplete({
                        minLength: 0,
                        source: function (request, response) {
                            const term = request.term.toLowerCase();
                            const selection = getTopics();

                            const matches = selection?.filter((obj) => {
                                return obj.label.toLowerCase().indexOf(term) > -1;
                            });

                            response(matches);
                        },
                        focus: function (event, ui) {
                            // Don't change the input value on hover/focus
                            event.preventDefault();
                        },
                        select: function (event, ui) {
                            event.preventDefault();
                            element.val(ui.item.topic);

                            // Call the onSelect callback if provided
                            if (onSelect) onSelect(element, ui.item);
                        }
                    })
                    .on("focus", function () {
                        element.autocomplete("search", element.val() || "");
                    })
                    .autocomplete("instance")._renderItem = function (ul, item) {
                        const term = this.term.trim();
                        const label = item.label;
                        let highlightedLabel = label;

                        if (term) {
                            const regex = new RegExp("(" + term.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&") + ")", "ig");
                            highlightedLabel = label.replace(regex, '<strong style="color:#e65; font-weight:bold">$1</strong>');
                        }

                        return $("<li></li>").data("ui-autocomplete-item", item).append(`<div>${highlightedLabel}</div>`).appendTo(ul);
                    };
            }

            // Return a list of topics from the controller configuration
            // Structure: [ { key: "ABC", member: 1, topic: test/1, label: ... } ]
            function getTopics() {
                const result = [];
                const controllers = _controllers?.controllers || [];

                for (const controller of controllers) {
                    result.push(...controller.formattedTopics);
                }

                return result;
            }
        }
    });
</script>

<!-- Define node description -->
<script type="text/html" data-help-name="uniflex-room-loop">
    <h3>Room-loop</h3>
    <p>
        Coordinates per-room PWM timing and publishes a room-scoped tick used by floor loops. Optionally computes a floor return setpoint (Tret_sp) using an embedded PI core and
        emits heat/cool request signals.
    </p>

    <h4>Inputs</h4>
    <ul>
        <li><b>Global tick</b> -- expects <code>{ ts, periodSec }</code> to synchronize room ticks.</li>
        <li><b>Room temperature</b> -- numeric (°C) on the configured Troom topic.</li>
        <li><b>Room setpoint</b> -- numeric (°C) on the configured SP topic.</li>
        <li><b>Optional refs</b> -- reference temperature/humidity for dewpoint safety (optional topics).</li>
        <li><b>Force / cooling inputs</b> -- IO topics forwarded to room-scoped topics for floor loops.</li>
    </ul>

    <h4>Outputs</h4>
    <ul>
        <li><b>Room tick</b> -- publishes <code>{ ts, periodSec }</code> on the configured room tick topic after <code>tickDelaySec</code> seconds.</li>
        <li><b>Floor setpoint (Tret_sp)</b> -- optional: computed by the embedded PI (Dd=0) and published to the configured Floor SP out topic.</li>
        <li><b>Heat / Cool requests</b> -- boolean/DO outputs emitted on configured topics.</li>
        <li><b>Presence</b> -- optional startup presence message <code>heating/&lt;roomId&gt;/presence</code> for discovery.</li>
    </ul>

    <h4>Behavior summary</h4>
    <ol>
        <li>On a global tick the node waits <code>tickDelaySec</code> and then publishes the room tick <code>{ ts, periodSec }</code>.</li>
        <li>If room temperature and setpoint are available the node can compute <code>Tret_sp</code> using the embedded PI (Kp, Ii). The PI runs in Ii-mode with <code>Dd=0</code>.</li>
        <li>Forward incoming force and cooling IO topics to room-scoped topics consumed by floor loops.</li>
    </ol>

    <h4>Example messages</h4>
    <p>Global tick (input):</p>
    <pre>{ "ts": 1690000000, "periodSec": 300 }</pre>

    <p>Room tick (output):</p>
    <pre>{ "ts": 1690000300, "periodSec": 300 }</pre>

    <p>Floor setpoint (output):</p>
    <pre>18.2  // numeric °C</pre>

    <h4>Notes</h4>
    <ul>
        <li>PI parameters (Kp, Ii) and clamp limits are configurable in the UI; Dd is unused for heating.</li>
        <li>Presence emission and forwarding topics help Coordinator and floor loops auto-discover room capabilities.</li>
        <li>All topics can be autocompleted from the controller configuration in the editor.</li>
    </ul>
</script>
