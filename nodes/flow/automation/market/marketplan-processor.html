<script type="text/javascript">
    RED.nodes.registerType("uniflex-marketplan-processor", {
        category: "uniflex home",
        color: "#D8BFD8",
        icon: "font-awesome/fa-bolt",
        defaults: {
            name: { value: "" },
            freqErrorTopic: { value: "FERV.1" },
            outputTopic: { value: "SDV.1" },
            calendarHost: { value: "localhost" },
            calendarPort: { value: 80, validate: RED.validators.number() },
            capRefreshSec: { value: 30, validate: RED.validators.number() },
            modelMode: { value: "sum" },
            testMode: { value: false },
            testSweepHz: { value: 0.5, validate: RED.validators.number() },
            testStepHz: { value: 0.05, validate: RED.validators.number() },
            testDwellMs: { value: 0, validate: RED.validators.number() },
            testCsvPath: { value: "/tmp/marketplan-test.csv" },
            testTriggerTopic: { value: "marketplan/test" },
            enableDebug: { value: false },
            services: {
                value: [
                    { serviceType: "fcrd_up", capTitle: "FcrD Up" },
                    { serviceType: "fcrd_down", capTitle: "FcrD Down" },
                    { serviceType: "fcrn", capTitle: "FcrN BiDirectional" }
                ]
            }
        },
        inputs: 1,
        outputs: 1,
        label: function () { return this.name || "marketplan"; },
        paletteLabel: "marketplan",

        oneditprepare: function () {
            const node = this;
            let calendarTitles = [];

            function loadCalendarTitles() {
                const host = $("#node-input-calendarHost").val() || "localhost";
                const port = Number($("#node-input-calendarPort").val() || 80);
                $.getJSON(`http://${host}:${port}/calendar/titles`, function (titles) {
                    calendarTitles = (titles || []).map(function (t) {
                        return { label: t, value: t };
                    });
                }).fail(function () {
                    calendarTitles = [];
                });
            }

            function initTopicAutocomplete(el) {
                $.getJSON("uniflex/controller-config", function (data) {
                    const topics = (data?.controllers || []).flatMap(function (c) {
                        return c.formattedTopics || [];
                    });
                    el.autocomplete({
                        minLength: 0,
                        source: function (req, res) {
                            const term = (req.term || "").toLowerCase();
                            res(topics.filter(function (item) {
                                const label = String(item.label || item.topic || "").toLowerCase();
                                const topic = String(item.topic || "").toLowerCase();
                                return label.indexOf(term) >= 0 || topic.indexOf(term) >= 0;
                            }));
                        },
                        select: function (e, ui) {
                            e.preventDefault();
                            el.val(ui.item.topic || ui.item.value || ui.item.label || "");
                        }
                    }).on("focus", function () {
                        el.autocomplete("search", el.val() || "");
                    });
                });
            }

            function initTitleAutocomplete(el) {
                el.autocomplete({
                    minLength: 0,
                    source: function (req, res) {
                        const term = (req.term || "").toLowerCase();
                        res(calendarTitles.filter(function (item) {
                            return item.label.toLowerCase().indexOf(term) >= 0;
                        }));
                    },
                    select: function (e, ui) {
                        e.preventDefault();
                        el.val(ui.item.value || ui.item.label || "");
                    }
                }).on("focus", function () {
                    el.autocomplete("search", el.val() || "");
                });
            }

            loadCalendarTitles();
            initTopicAutocomplete($("#node-input-freqErrorTopic"));
            initTopicAutocomplete($("#node-input-outputTopic"));
            initTopicAutocomplete($("#node-input-testTriggerTopic"));

            let outputTopic = node.outputTopic;
            if (!outputTopic && node.outTopic) {
                outputTopic = node.outTopic;
                if (!/\.\d+$/.test(outputTopic)) {
                    const member = Math.max(1, parseInt(node.outMember, 10) || 1);
                    outputTopic = `${outputTopic}.${member}`;
                }
            }
            $("#node-input-outputTopic").val(outputTopic || "SDV.1");

            if (!$("#node-input-testSweepHz").val()) {
                $("#node-input-testSweepHz").val(node.testSweepHz != null ? node.testSweepHz : 0.5);
            }
            if (!$("#node-input-testStepHz").val()) {
                $("#node-input-testStepHz").val(node.testStepHz != null ? node.testStepHz : 0.05);
            }
            if (!$("#node-input-testDwellMs").val() && $("#node-input-testDwellMs").val() !== "0") {
                $("#node-input-testDwellMs").val(node.testDwellMs != null ? node.testDwellMs : 0);
            }

            const services = Array.isArray(node.services) ? node.services : [];

            $("#services-container").editableList({
                removable: true,
                sortable: true,
                header: $("<div>").append($.parseHTML(
                    '<div class="mpp-service-header">' +
                    '<span class="mpp-col-type">Service</span>' +
                    '<span class="mpp-col-cap">Calendar title (MW cap)</span>' +
                    '</div>'
                )),
                addItem: function (container, index, data) {
                    const row = $('<div class="mpp-service-row"></div>').appendTo(container);
                    const typeSel = $('<select class="mpp-service-type"></select>').appendTo(row);
                    typeSel.append('<option value="fcrd_up">FcrD Up</option>');
                    typeSel.append('<option value="fcrd_down">FcrD Down</option>');
                    typeSel.append('<option value="fcrn">FcrN BiDirectional</option>');
                    typeSel.attr("title", "FCR product type (N +/-0.1 Hz, D 0.4 Hz beyond band per Nordic spec)");

                    const capIn = $('<input type="text" class="mpp-cap-title" placeholder="calendar title" />').appendTo(row);
                    capIn.attr("title", "Calendar title for MW cap. Cap 0 disables this product.");

                    typeSel.val(data.serviceType || "fcrn");
                    capIn.val(data.capTitle || "");

                    initTitleAutocomplete(capIn);
                },
                addButton: true,
                height: "auto"
            });

            services.forEach(function (svc) {
                $("#services-container").editableList("addItem", svc);
            });

            if (services.length === 0) {
                [
                    { serviceType: "fcrd_up", capTitle: "FcrD Up" },
                    { serviceType: "fcrd_down", capTitle: "FcrD Down" },
                    { serviceType: "fcrn", capTitle: "FcrN BiDirectional" }
                ].forEach(function (svc) {
                    $("#services-container").editableList("addItem", svc);
                });
            }
        },

        oneditsave: function () {
            const services = [];
            $("#services-container").editableList("items").each(function () {
                const el = $(this);
                services.push({
                    serviceType: el.find(".mpp-service-type").val(),
                    capTitle: el.find(".mpp-cap-title").val()
                });
            });
            this.services = services;
        }
    });
</script>

<script type="text/html" data-template-name="uniflex-marketplan-processor">
    <div class="mpp-div">
        <div class="form-row">
            <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-input-name" placeholder="marketplan" />
        </div>

        <div class="form-divider"></div>
        <b>Inputs / output</b>
        <div class="form-row">
            <label for="node-input-freqErrorTopic">Frequency error</label>
            <input type="text" id="node-input-freqErrorTopic" placeholder="FERV.1"
                title="Input topic for grid frequency error in Hz from 50.0 Hz" />
        </div>
        <div class="help-text">Grid frequency error in Hz from 50.0 Hz. Positive error gives negative kW output.</div>

        <div class="form-row">
            <label for="node-input-outputTopic">Output topic</label>
            <input type="text" id="node-input-outputTopic" placeholder="SDV.1"
                title="Full flow topic for setpoint delta in kW, e.g. SDV.1" />
        </div>
        <div class="help-text">Setpoint delta (kW) published on this topic, e.g. SDV.1 for iolayer channel SDV member 1.</div>

        <div class="form-divider"></div>
        <b>Model</b>
        <div class="form-row">
            <label for="node-input-modelMode">Mode</label>
            <select id="node-input-modelMode" style="width:160px;"
                title="sum: Nordic parallel FCR-N + FCR-D. switch: one product by frequency region.">
                <option value="sum">sum</option>
                <option value="switch">switch</option>
            </select>
        </div>
        <div class="help-text">Nordic steady-state: sum = FCR-N + FCR-D parallel. switch = one product, 15 s delay returning D to N inside band.</div>

        <div class="form-divider"></div>
        <b>Calendar API</b>
        <div class="form-row">
            <label for="node-input-calendarHost">Calendar host</label>
            <input type="text" id="node-input-calendarHost" style="width:160px;"
                title="Host for /calendar API (iolayer HTTP)" />
        </div>
        <div class="form-row">
            <label for="node-input-calendarPort">Calendar port</label>
            <input type="number" id="node-input-calendarPort" style="width:80px;"
                title="HTTP port for calendar API" />
        </div>
        <div class="form-row">
            <label for="node-input-capRefreshSec">Cap refresh (s)</label>
            <input type="number" id="node-input-capRefreshSec" min="5" step="5" style="width:80px;"
                title="How often to re-read MW caps from calendar" />
        </div>

        <div class="form-divider"></div>
        <b>FCR services</b>
        <div class="help-text">One row per product. Spans fixed per Nordic spec (N 0.1 Hz, D 0.4 Hz). Calendar cap 0 disables product.</div>
        <ol id="services-container"></ol>

        <div class="form-divider"></div>
        <b>Test sweep</b>
        <div class="form-row">
            <label for="node-input-testMode">Test mode</label>
            <input type="checkbox" id="node-input-testMode" style="width:auto;"
                title="Run frequency error sweep automatically on deploy" />
        </div>
        <div class="help-text">Sweep on deploy. Re-trigger with inject on the test topic below.</div>
        <div class="form-row">
            <label for="node-input-testTriggerTopic">Test topic</label>
            <input type="text" id="node-input-testTriggerTopic" placeholder="marketplan/test"
                title="Inject on this topic to re-run the ferr sweep" />
        </div>
        <div class="form-row">
            <label for="node-input-testSweepHz">Sweep range (+/- Hz)</label>
            <input type="number" id="node-input-testSweepHz" min="0.001" step="any" style="width:80px;"
                title="Sweep ferr from -range to +range Hz, default 0.5" />
        </div>
        <div class="form-row">
            <label for="node-input-testStepHz">Sweep step (Hz)</label>
            <input type="number" id="node-input-testStepHz" min="0.001" step="any" style="width:80px;"
                title="Frequency step size during sweep, e.g. 0.05 or 0.07" />
        </div>
        <div class="form-row">
            <label for="node-input-testDwellMs">Pause between steps (ms)</label>
            <input type="number" id="node-input-testDwellMs" min="0" step="any" style="width:80px;"
                title="Optional delay so each SDV is visible in the flow. 0 = instant sweep, same CSV." />
        </div>
        <div class="help-text">Pause is optional. CSV depends on ferr values only, not timing. Use 0 unless you want to watch SDV change live in the flow.</div>
        <div class="form-row">
            <label for="node-input-testCsvPath">CSV file path</label>
            <input type="text" id="node-input-testCsvPath" placeholder="/tmp/marketplan-test.csv" style="width:70%;"
                title="File path where sweep results are written when test completes" />
        </div>
        <div class="help-text">Base path for sweep CSV. Model and caps are appended, e.g. marketplan_test_sum_N0.700_Du0.200_Dd0.600.csv</div>

        <div class="form-row">
            <label for="node-input-enableDebug"><i class="fa fa-bug"></i> Debug</label>
            <input type="checkbox" id="node-input-enableDebug" style="width:auto;"
                title="Verbose log lines for cap refresh and sweep steps" />
        </div>
    </div>
</script>

<script type="text/html" data-help-name="uniflex-marketplan-processor">
    <h3>Marketplan processor</h3>
    <p>Computes FCR setpoint delta (kW) from grid frequency error and effective MW caps in calendar.</p>
    <h4>Nordic steady-state (Appendix 2)</h4>
    <ul>
        <li>FCR-N: +/- 0.1 Hz from 50.0 Hz, linear, saturated outside band</li>
        <li>FCR-D: zero at 49.9 / 50.1 Hz, full over 0.4 Hz beyond band edge</li>
        <li><b>sum</b>: parallel N + D (Section 3.6.1)</li>
        <li><b>switch</b>: one product; immediate N to D at band edge; 15 s delay D to N</li>
    </ul>
    <p>Dynamic response (ramps, 7.5 s targets) is not in this node - handled by actuators downstream.</p>
    <h4>Model modes</h4>
    <ul>
        <li><b>sum</b>: Nordic parallel model for multi-product delivery</li>
        <li><b>switch</b>: Single-controller model with 15 s return delay in live operation</li>
    </ul>
    <p>Calendar cap 0 disables a product for the current interval.</p>
    <h4>Test sweep</h4>
    <p>Enable test mode to sweep ferr from -range to +range on deploy. Test uses steady-state regions (no switch delay). CSV rows: ferr and kW; model and caps in filename.</p>
    <h4>Output</h4>
    <p>SDV setpoint delta (kW) on output topic (default SDV.1).</p>
</script>
