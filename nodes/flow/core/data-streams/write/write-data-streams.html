                }

            tcpPort: {
                value: 19080,

                    const n = parseInt(v);
                    return Number.isInteger(n) && n > 0 && n < 65536;
                }

                value: 1500,
                validate: function (v) {
                    const n = parseInt(v);
                    return Number.isInteger(n) && n >= 0;

            // Namespaced selectors for binding/unbinding
            const controllerSelector = "#node-input-controller";
            const changeSelectors = "#mappings-container, #node-input-payloadType, #node-input-outputMode";
            const payloadTypeSelector = "#node-input-payloadType";
            const loadingSelector = "#write-ds-loading";
            const mappingsSelector = "#mappings-container";
            const mappingsOverlaySelector = "#write-ds-mappings-overlay";
            let loadingStartedAt = 0;
            let loadingHideTimer = null;
            const MIN_LOADING_VISIBLE_MS = 450;

            function setLoadingState(isLoading, text) {
                const $loading = $(loadingSelector);
                const $mappings = $(mappingsSelector);
                const $overlay = $(mappingsOverlaySelector);
                if (!$loading.length || !$mappings.length || !$overlay.length) return;
                if (isLoading) {
                    if (loadingHideTimer) {
                        clearTimeout(loadingHideTimer);
                        loadingHideTimer = null;
                    }
                    loadingStartedAt = Date.now();
                    $loading.find(".write-ds-loading-text").text(text || "Loading...");
                    $loading.show();
                    $mappings.addClass("write-ds-loading-dim");
                    $overlay.show();
                } else {
                    const elapsed = Date.now() - loadingStartedAt;
                    const delay = Math.max(0, MIN_LOADING_VISIBLE_MS - elapsed);
                    const hideNow = () => {
                        $loading.hide();
                        $mappings.removeClass("write-ds-loading-dim");
                        $overlay.hide();
                    };
                    if (delay > 0) {
                        loadingHideTimer = setTimeout(() => {
                            loadingHideTimer = null;
                            hideNow();
                        }, delay);
                    } else {
                        hideNow();
                    }
                }
            }

            function bindEditorHandlers() {
                $(controllerSelector).off(".writeDsCtrl").on("change.writeDsCtrl", queryControllerConfig);

                $(changeSelectors).off(".writeDsChange").on("change.writeDsChange", function () {
                    updateTipText();
                });

                $(payloadTypeSelector).off(".writeDsPayload").on("change.writeDsPayload", function () {
                    const rows = getListElements();
                    for (const elements of rows) {
                        populatePayload(elements);
                        validatePayload(elements);
                    }
                });
            }

            function unbindEditorHandlers() {
                $(controllerSelector).off(".writeDsCtrl");
                $(changeSelectors).off(".writeDsChange");
                $(payloadTypeSelector).off(".writeDsPayload");
            }

            // Bind once per editor open
            bindEditorHandlers();

            // Initialize the form fields
            let currentSortColumn = "topic"; // Declare at function scope level
            initializeEditableList();

            // Query variables related to controller configuration
            function queryControllerConfig() {
                const controllerId = $("#node-input-controller").val();

                if (_lastControllerId === controllerId) {
                    return;
                }
                _lastControllerId = controllerId;

                // If controller is not selected yet, just render existing mappings (no dropdown options available)
                if (!controllerId) {
                    $("#mappings-container").editableList("empty");
                    $("#mappings-container").editableList("addItems", mappings);
                    updateTipText();
                    try {
                        triggerSort();
                        scheduleRefreshAllPlusButtons();
                    } finally {
                        requestAnimationFrame(() => setLoadingState(false));
                    }
                    return;
                }

                // Abort any in-flight request
                if (_controllerReq && typeof _controllerReq.abort === "function") {
                    _controllerReq.abort();
                }

                setLoadingState(true, "Loading controller config...");

                _controllerReq = $.ajax({
                    url: `uniflex/controller-config?id=${controllerId}`,
                    dataType: 'json',
                    timeout: 10000 // 10 second timeout to prevent long hangs
                })
                    .done(function (data) {
                        _controller = data;
                        rebuildKeySuggestionsCache();
                    })
                    .fail(function (jqXHR, textStatus, errorThrown) {
                        RED.notify("Failed to query controller configuration!", { type: "error", timeout: 3000 });
                        _controller = {};
                        _keySuggestionsCache = [];
                    })
                    .always(function () {
                        const channelCount = Object.keys(_controller?.channels || {}).length;

                        // Check if request was aborted
                        if (_controllerReq && (_controllerReq.statusText === "abort" || _controllerReq.readyState === 0)) {
                            setLoadingState(false);
                            return;
                        }

                        // Check if dialog is still visible
                        try {
                            const $dlgCheck = $("#dialog-form");
                            const isVisible = $dlgCheck.is(":visible");
                            if (!isVisible) {
                                setLoadingState(false);
                                return;
                            }
                        } catch (e) {
                            setLoadingState(false);
                            return;
                        }

                        try {
                            $("#mappings-container").editableList("empty");
                            $("#mappings-container").editableList("addItems", mappings);
                            updateTipText();
                            triggerSort();
                            scheduleRefreshAllPlusButtons();
                        } catch (e) {
                            // no-op
                        } finally {
                            requestAnimationFrame(() => setLoadingState(false));
                        }
                    });
            }

            function rebuildKeySuggestionsCache() {
                const channels = _controller?.channels || {};
                const filteredServices = _controller?.filteredServices || {};
                const sortSource = {};
                Object.keys(channels).forEach((key) => {
                    sortSource[key] = filteredServices[key] || { servicename: key };
                });
                const keys = sortKeysByServiceNames(sortSource);
                _keySuggestionsCache = keys.map((key) => {
                    const serviceName = filteredServices[key]?.servicename || key;
                    return {
                        key,
                        label: `${serviceName} (${key})`,
                        value: key
                    };
                });
            }

            // IMPORTANT: Fetch controller data FIRST, then render rows
            // This ensures dropdowns have data when rows are created
            const initialControllerId = $("#node-input-controller").val();

            if (initialControllerId) {
                // Show loading state - don't render rows yet
                setLoadingState(true, "Loading controller config...");
                $("#mappings-container").editableList("empty");
                queryControllerConfig(); // This will render rows in .always() callback
            } else {
                // No controller selected - render rows immediately (will have empty dropdowns)
                $("#mappings-container").editableList("empty");
                $("#mappings-container").editableList("addItems", mappings);
                updateTipText();
                try {
                    triggerSort();
                    scheduleRefreshAllPlusButtons();
                } finally {
                    requestAnimationFrame(() => setLoadingState(false));
                }
            }

            // --- Helpers for 'Add next' & 'Add all' ---
            function readAllRows() {
                const rows = [];
                $("#mappings-container")
                    .editableList("items")
                    .each(function () {
                        const c = $(this);
                        rows.push({
                            keyNameSelect: c.find(".node-input-keyNameSelect").val() || "",
                            keyNameManual: c.find(".node-input-keyNameManual").val() || "",
                            index: parseInt(c.find(".node-input-index").val() || "0", 10) || 0
                        });
                    });
                return rows;
            }
            function getUsedIndicesForKey(key) {
                const rows = readAllRows();
                return new Set(
                    rows
                        .filter((r) => (r.keyNameSelect || r.keyNameManual) === key)
                        .map((r) => r.index)
                        .filter((n) => Number.isInteger(n) && n > 0)
                );
            }
            function computeMissingForKey(key) {
                const used = Array.from(getUsedIndicesForKey(key)).sort((a, b) => a - b);
                const missing = [];
                let expect = 1;
                for (const n of used) {
                    while (expect < n) {
                        missing.push(expect);
                        expect++;
                    }
                    expect = n + 1;
                }
                // also offer the immediate next
                missing.push(expect);
                return missing;
            }

            // TEMPORARILY DISABLED FOR DIAGNOSTIC: test if this causes the reopen

            // Initialize the EditableList widget
            function initializeEditableList() {
                $("#mappings-container").editableList({
                    removable: true,
                    sortable: true,
                    header: $("<div>").append(

                        <div style="width:22px"></div>

                                    RED.notify("No available data streams to auto-generate mappings!", { type: "warning", timeout: 3000 });

                                }

                                autoGenerateMappings();

                        initializeAutocomplete(el.topicElement, onAutocompleteSelect);

                        // Add refresh for plus button
                        refreshPlusButtonFor(container);

                setTimeout(function () {
